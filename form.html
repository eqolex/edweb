<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
</head>
<body>
    <main>
        <h1>Регистрация</h1>
        <form action="#" method="POST">
            <p>
                <label for="login">Логин:</label>
                <input type="text" id="login" name="login" required minlength="3" placeholder="Минимум 3 символа">
            </p>
            <p>
                <label for="email">Электронная почта:</label>
                <input type="email" id="email" name="email" required placeholder="example@mail.com">
            </p>
            <p>
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required minlength="6" placeholder="Минимум 6 символов">
            </p>
            <p>
                <label for="password_confirm">Подтверждение пароля:</label>
                <input type="password" id="password_confirm" name="password_confirm" required minlength="6" placeholder="Повторите пароль">
            </p>
            <p>
                <label for="country">Страна:</label>
                <select id="country" name="country" required>
                    <option value="">Выберите страну</option>
                    <option value="ru">Россия</option>
                    <option value="by">Беларусь</option>
                    <option value="kz">Казахстан</option>
                    <option value="am">Армения</option>
                    <option value="us">США</option>
                </select>
            </p>
            <p>
                <label for="city">Город:</label>
                <textarea id="city" name="city" rows="2" cols="30" required minlength="2" placeholder="Введите город"></textarea>
            </p>
            <p>
                <button type="submit">Зарегистрироваться</button>
            </p>
        </form>
    </main>

</body>
